<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BottleNet | Mobile Mockups</title>
  <link rel="stylesheet" href="mockups.css">
</head>
<body>
  <main>
    <header class="heading">
      <div class="identity"><img src="../assets/images/bottlenet-mark.svg" alt=""><span>BottleNet</span></div>
      <div class="heading-bottom"><div><p class="eyebrow">MOBILE INTERFACE</p><h1>Deposit plastic bottles. Get free Wi-Fi.</h1></div><span class="edition">UI PROTOTYPE / 01</span></div>
    </header>
    <section class="mockup-grid" aria-label="Mobile screen mockups">
      <figure id="portal" class="mockup">
        <figcaption><span class="number">01</span><div><h2>Connection portal</h2><p>Time, rewards, and your next bottle.</p></div></figcaption>
        <div class="phone"><div class="status-bar"><span>9:41</span><span class="camera"></span><span class="phone-indicators">▂▄▆ <span class="battery"></span></span></div><div class="screen"><img src="screens/portal.png" alt="BottleNet mobile connection portal showing 18 minutes and 42 seconds remaining"></div><div class="home-area"><span></span></div></div>
        <a class="full-page-link" href="screens/portal-full.png">View full screen <span>↗</span></a>
      </figure>
      <figure id="pin" class="mockup">
        <figcaption><span class="number">02</span><div><h2>Admin access</h2><p>A focused, four-digit PIN entry.</p></div></figcaption>
        <div class="phone"><div class="status-bar"><span>9:41</span><span class="camera"></span><span class="phone-indicators">▂▄▆ <span class="battery"></span></span></div><div class="screen"><img src="screens/pin.png" alt="BottleNet admin login with four separate PIN fields"></div><div class="home-area"><span></span></div></div>
        <a class="full-page-link" href="screens/pin.png">View full screen <span>↗</span></a>
      </figure>
      <figure id="dashboard" class="mockup">
        <figcaption><span class="number">03</span><div><h2>Station dashboard</h2><p>Collection and connectivity at a glance.</p></div></figcaption>
        <div class="phone"><div class="status-bar"><span>9:41</span><span class="camera"></span><span class="phone-indicators">▂▄▆ <span class="battery"></span></span></div><div class="screen"><img src="screens/dashboard.png" alt="BottleNet mobile admin overview with station metrics and bottle collection chart"></div><div class="home-area"><span></span></div></div>
        <a class="full-page-link" href="screens/dashboard-full.png">View full screen <span>↗</span></a>
      </figure>
    </section>
    <footer><span>Plastic bottles. Real possibilities.</span><span>Current UI · Sample data · 390 × 844 viewport</span></footer>
  </main>
</body>
</html>
